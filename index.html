<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Estudiantes | ITLA</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="cabecera">
      <div class="cabecera__contenido">
        <h1>Sistema de Gestión de Estudiantes</h1>
        <p>Instituto Tecnológico de las Américas &middot; Programación III</p>
      </div>
    </header>

    <main class="contenedor">
      <p id="aviso" class="aviso" hidden></p>

      <section class="panel" id="panel-registro">
        <h2>Registrar estudiante</h2>
        <form id="formulario-estudiante" class="formulario" novalidate>
          <input type="hidden" id="estudiante-id" />

          <div class="campo">
            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" placeholder="2023-0451" />
          </div>

          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="María Fernández" />
          </div>

          <div class="campo">
            <label for="carrera">Carrera</label>
            <select id="carrera">
              <option value="">Seleccione una carrera</option>
              <option>Desarrollo de Software</option>
              <option>Redes de la Información</option>
              <option>Multimedia</option>
              <option>Ciberseguridad</option>
              <option>Mecatrónica</option>
              <option>Inteligencia Artificial</option>
            </select>
          </div>

          <div class="campo">
            <label for="correo">Correo institucional</label>
            <input type="email" id="correo" placeholder="mfernandez@itla.edu.do" />
          </div>

          <div class="campo">
            <label for="indice">Índice académico</label>
            <input type="number" id="indice" step="0.01" min="0" max="4" placeholder="3.75" />
          </div>

          <div class="acciones-formulario">
            <button type="submit" class="boton" id="boton-guardar">Guardar</button>
          </div>
        </form>
      </section>

      <section class="panel" id="panel-listado">
        <h2>Estudiantes registrados</h2>
        <div id="contenedor-tabla" class="tabla-scroll"></div>
      </section>
    </main>

    <footer class="pie">
      <p>Tarea 3 &middot; Uso de Git y Git Flow</p>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/registro.js"></script>
    <script src="js/listado.js"></script>
  </body>
</html>
